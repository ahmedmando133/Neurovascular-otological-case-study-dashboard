<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDT Clinical Case Study — Amal Mokhtar Mohamed Ibrahim (63.5y F)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-mesh: radial-gradient(circle at 12% 10%, rgba(14, 165, 233, 0.14), transparent 36%),
             radial-gradient(circle at 88% 18%, rgba(99, 102, 241, 0.12), transparent 38%),
             radial-gradient(circle at 50% 90%, rgba(20, 184, 166, 0.10), transparent 45%),
             #edf2f7;
  --glass-bg: rgba(255, 255, 255, 0.80);
  --glass-strong: rgba(255, 255, 255, 0.92);
  --glass-border: rgba(148, 163, 184, 0.34);
  --glass-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  --header-bg: rgba(15, 23, 42, 0.88);
  --text: #0f172a;
  --text-muted: #475569;
  --accent: #0284c7;
  --accent-dark: #0369a1;
  --accent-soft: rgba(2, 132, 199, 0.12);
  --red: #dc2626;
  --red-bg: rgba(254, 242, 242, 0.88);
  --red-border: rgba(239, 68, 68, 0.42);
  --amber: #b45309;
  --amber-bg: rgba(255, 251, 235, 0.88);
  --amber-border: rgba(245, 158, 11, 0.45);
  --green: #15803d;
  --green-bg: rgba(240, 253, 244, 0.88);
  --green-border: rgba(34, 197, 94, 0.42);
  --blue-bg: rgba(239, 246, 255, 0.88);
  --blue-border: rgba(59, 130, 246, 0.42);
  --code-bg: rgba(15, 23, 42, 0.06);
  --table-head: rgba(241, 245, 249, 0.92);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Plus Jakarta Sans', 'Inter', sans-serif;
}

html[lang="ar"] {
  --font-sans: 'Cairo', 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  --font-display: 'Cairo', 'Tajawal', sans-serif;
}

[data-theme="dark"] {
  --bg-mesh: radial-gradient(circle at 15% 10%, rgba(14, 165, 233, 0.18), transparent 36%),
             radial-gradient(circle at 85% 20%, rgba(99, 102, 241, 0.16), transparent 40%),
             #0b1120;
  --glass-bg: rgba(17, 24, 39, 0.78);
  --glass-strong: rgba(30, 41, 59, 0.90);
  --glass-border: rgba(148, 163, 184, 0.22);
  --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  --header-bg: rgba(9, 13, 24, 0.92);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #38bdf8;
  --accent-dark: #0ea5e9;
  --accent-soft: rgba(56, 189, 248, 0.16);
  --red: #f87171;
  --red-bg: rgba(69, 10, 10, 0.58);
  --red-border: rgba(248, 113, 113, 0.40);
  --amber: #fbbf24;
  --amber-bg: rgba(69, 26, 3, 0.55);
  --amber-border: rgba(251, 191, 36, 0.40);
  --green: #4ade80;
  --green-bg: rgba(5, 46, 22, 0.55);
  --green-border: rgba(74, 222, 128, 0.38);
  --blue-bg: rgba(23, 37, 84, 0.55);
  --blue-border: rgba(96, 165, 250, 0.38);
  --code-bg: rgba(255, 255, 255, 0.09);
  --table-head: rgba(15, 23, 42, 0.92);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: clip; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  background: var(--bg-mesh);
  background-attachment: fixed;
  min-height: 100vh;
  overflow-x: clip;
}
h1, h2, h3, h4 {
  font-family: var(--font-display);
  margin: 0 0 8px 0;
  line-height: 1.3;
}
code {
  font-family: 'Cascadia Code', Consolas, monospace;
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 5px;
  direction: ltr;
  unicode-bidi: isolate;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* STICKY GLASS HEADER */
.glass-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--header-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: #f8fafc;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  padding: 12px 20px;
}
.header-inner {
  max-width: 1480px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.brand-box h1 {
  font-size: 17px;
  font-weight: 800;
  color: #f8fafc;
  margin-bottom: 2px;
}
.brand-sub {
  font-size: 12px;
  color: #cbd5e1;
}
.header-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

/* SEGMENTED EN | عربي مصري PILL TOGGLE */
.lang-pill {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.24);
  backdrop-filter: blur(10px);
}
.lang-opt {
  border: none;
  background: transparent;
  color: #cbd5e1;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.lang-opt.active {
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  color: #ffffff;
  box-shadow: 0 2px 10px rgba(14, 165, 233, 0.45);
}

.ctrl-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 9px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.10);
  color: #f8fafc;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s;
  white-space: nowrap;
}
.ctrl-btn:hover { background: rgba(255, 255, 255, 0.20); }
.ctrl-btn.primary {
  background: linear-gradient(135deg, #0284c7, #0369a1);
  border-color: rgba(56, 189, 248, 0.45);
}

/* LAYOUT SHELL */
.shell {
  max-width: 1480px;
  margin: 0 auto;
  padding: 18px 20px 36px;
  display: grid;
  grid-template-columns: 276px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.sidebar {
  position: sticky;
  top: 82px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: var(--glass-shadow);
  padding: 16px;
}
.nav-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.nav-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  text-align: start;
  padding: 10px 12px;
  margin-bottom: 6px;
  border-radius: 11px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 12.8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.16s ease;
}
.nav-btn:hover {
  background: var(--accent-soft);
  border-color: var(--glass-border);
}
.nav-btn.active {
  background: linear-gradient(135deg, #0284c7, #1d4ed8);
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(2, 132, 199, 0.28);
}
.nav-pill {
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.22);
  color: inherit;
  white-space: nowrap;
}
.nav-btn.active .nav-pill {
  background: rgba(255, 255, 255, 0.24);
  color: #ffffff;
}

.pdf-list a {
  display: block;
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: 9px;
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  transition: border-color 0.15s;
}
.pdf-list a:hover {
  border-color: var(--accent);
  color: var(--accent);
  text-decoration: none;
}

/* PANELS & TYPOGRAPHY */
main { min-width: 0; }
.tab-panel { display: none; animation: fadeIn 0.22s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

.section-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.section-head h2 {
  font-size: 19px;
  font-weight: 800;
  margin: 0;
}
.section-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin: 4px 0 14px;
}

/* GRIDS */
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }

.kpi {
  background: var(--glass-strong);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 14px;
  box-shadow: var(--glass-shadow);
  border-top: 3px solid var(--accent);
}
.kpi.danger { border-top-color: var(--red); }
.kpi.warn { border-top-color: #f59e0b; }
.kpi .lbl { font-size: 11.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
.kpi .val { font-size: 19px; font-weight: 800; font-family: var(--font-display); margin-bottom: 4px; }
.kpi .sub { font-size: 12px; color: var(--text-muted); line-height: 1.45; }

/* JUMP BANNER & ALERTS */
.jump-banner {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.90), rgba(30, 58, 138, 0.86));
  color: #f8fafc;
  border: 1px solid rgba(56, 189, 248, 0.35);
  box-shadow: var(--glass-shadow);
  margin-bottom: 16px;
}
.jump-cta {
  padding: 9px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #38bdf8, #0284c7);
  color: #ffffff;
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.jump-cta:hover { filter: brightness(1.08); }

.alert {
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(10px);
  margin-bottom: 16px;
  font-size: 13px;
}
.alert-red { background: var(--red-bg); border-color: var(--red-border); }
.alert-amber { background: var(--amber-bg); border-color: var(--amber-border); }
.alert-blue { background: var(--blue-bg); border-color: var(--blue-border); }
.alert-green { background: var(--green-bg); border-color: var(--green-border); }

/* BADGES & PILLS */
.badge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.b-blue { background: rgba(14, 165, 233, 0.16); color: #0369a1; }
.b-red { background: rgba(239, 68, 68, 0.16); color: #b91c1c; }
.b-amber { background: rgba(245, 158, 11, 0.18); color: #b45309; }
.b-green { background: rgba(34, 197, 94, 0.16); color: #15803d; }
.b-purple { background: rgba(139, 92, 246, 0.16); color: #6d28d9; }
[data-theme="dark"] .b-blue { color: #7dd3fc; }
[data-theme="dark"] .b-red { color: #fca5a5; }
[data-theme="dark"] .b-amber { color: #fcd34d; }
[data-theme="dark"] .b-green { color: #86efac; }
[data-theme="dark"] .b-purple { color: #c4b5fd; }

/* HERO VIDEO SUITE (TAB 2 TOP) */
.video-suite-hero {
  background: var(--glass-strong);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(56, 189, 248, 0.36);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--glass-shadow);
  margin-bottom: 18px;
}
.video-suite-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.video-suite-head h2 { font-size: 18px; margin: 0; font-weight: 800; }
.video-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.video-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.video-frame-wrap {
  background: #020617;
  padding: 8px;
}
.video-frame-wrap video {
  width: 100%;
  height: 256px;
  object-fit: contain;
  border-radius: 8px;
  background: #000000;
  display: block;
}
.video-card-body {
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}
.video-card-body h4 { font-size: 14px; font-weight: 700; margin: 0; }
.video-card-body p { font-size: 12.6px; color: var(--text-muted); margin: 0; }
.video-actions {
  margin-top: auto;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--glass-border);
}
.btn-download {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 8px;
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: #ffffff !important;
  font-size: 12px;
  font-weight: 700;
  text-decoration: none !important;
}
.btn-download:hover { filter: brightness(1.08); }

/* TABLES & FILTER BARS */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
  margin-bottom: 12px;
}
.btn-filter {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.btn-filter.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}
.search-input {
  flex: 1 1 240px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
}
.table-wrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.6px;
}
th, td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--glass-border);
  text-align: start;
  vertical-align: top;
}
th {
  background: var(--table-head);
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }

/* TIMELINE */
.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.tl-item {
  display: grid;
  grid-template-columns: 155px minmax(0, 1fr);
  gap: 12px;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
}
.tl-date {
  font-weight: 800;
  color: var(--accent);
  font-size: 12.5px;
  font-family: 'Cascadia Code', Consolas, monospace;
  direction: ltr;
  text-align: start;
}

/* ROI GALLERY & MODAL */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.roi-card {
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.roi-img-box {
  height: 196px;
  background: #0f172a;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: zoom-in;
  overflow: hidden;
}
.roi-img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.25s ease;
}
.roi-card:hover .roi-img-box img { transform: scale(1.03); }
.roi-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.roi-body h4 { font-size: 13.5px; font-weight: 700; margin: 0; }
.roi-body p { font-size: 12px; color: var(--text-muted); margin: 0; flex: 1; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(2, 6, 23, 0.80);
  backdrop-filter: blur(8px);
}
.modal.open { display: flex; }
.modal-box {
  width: min(1160px, 96vw);
  max-height: 92vh;
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.modal-img-wrap {
  flex: 1;
  min-height: 300px;
  max-height: 70vh;
  overflow: auto;
  background: #020617;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-img-wrap img {
  max-width: 100%;
  max-height: 68vh;
  transform-origin: center center;
  transition: transform 0.18s ease;
}

/* SVG CONTAINER */
.svg-wrap { width: 100%; overflow-x: auto; }
.svg-wrap svg { width: 100%; height: auto; display: block; }

/* CONSULTANT & RANKED CARDS */
.consultant-card {
  background: var(--glass-strong);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--glass-shadow);
  margin-bottom: 14px;
}
.verdict-box {
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--accent-soft);
  border: 1px solid var(--glass-border);
  margin: 10px 0 12px;
  font-size: 13px;
}
.rank-card {
  display: grid;
  grid-template-columns: 54px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--glass-border);
  background: var(--glass-strong);
  margin-bottom: 10px;
}
.rank-num {
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, #0284c7, #1d4ed8);
  color: #ffffff;
  font-weight: 800;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CHECKLIST */
.check-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 9px 10px;
  border-bottom: 1px solid var(--glass-border);
  cursor: pointer;
}
.check-row:last-child { border-bottom: none; }
.check-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent); }
.check-done { text-decoration: line-through; color: var(--text-muted); }

@media (max-width: 1120px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; }
  .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 780px) {
  .grid-4, .grid-3, .grid-2, .video-grid, .gallery-grid { grid-template-columns: 1fr; }
  .tl-item { grid-template-columns: 1fr; gap: 4px; }
  .glass-header { padding: 10px 12px; }
  .shell { padding: 12px; }
}
@media print {
  .no-print, .sidebar, .header-controls { display: none !important; }
  .shell { display: block; padding: 0; }
  body.print-all .tab-panel { display: block !important; page-break-after: always; }
}
</style>
</head>
<body>

<header class="glass-header">
  <div class="header-inner">
    <div class="brand-box">
      <h1 id="brandTitle">MDT Clinical Case Study | Complex Neuro-Vascular &amp; Otological Evaluation</h1>
      <div class="brand-sub" id="brandSub"></div>
    </div>
    <div class="header-controls no-print">

ly lack perpendicular Dawson fingers, corpus callosum callosal-septal plaques, cerebellar peduncle/brainstem lesions, or juxtacortical U-fiber involvement.", "<strong>DWI/ADC Clearance & Chronic Lacunes (ROI3):</strong> Negative isoDWI/ADC excludes acute ischemia; established chronic cavitary lacunes reside in Right Lentiform Basal Ganglia, Left Frontal & Right Parietal white matter.", "<strong>Holter–Carotid–CSVD Coupling:</strong> The 24h Holter finding of <code>-2.1 mm ST depression</code> (13:11 CH3) + <code>3.78%</code> AM PVC burden + <code>0.13 cm</code> carotid IMT accelerates cerebral small vessel endothelial dysfunction and postural autoregulatory lags.", "<strong>No LP or Immunotherapy Needed:</strong> Visual loss (<code>&lt; 1/60</code>) represents prior diabetic/vascular retinal detachment + optic atrophy, NOT MS optic neuritis. <strong>Do NOT perform lumbar puncture.</strong>"], "tie": "Prevents harmful, unnecessary MS workup/lumbar puncture and shifts focus to aggressive vascular/glycemic microvascular stabilization."}, {"id": 3, "role": "Consultant 3 — Medical Neurology, Vascular & Movement Disorders", "badge": "b-amber", "verdict": "Mixed Tremor (Essential Tremor + Titubation + BG Lacunar Vulnerability + Morning Insulin Adrenergic Dips)", "findings": ["<strong>Movement Reconciliation (2026-11-03 Note + 2024 2h EEG):</strong> Prior chronic PD/Sinemet prescribing conflicts with Prof. Dr. Galhom's bedside note logging <code>Essential tremor + Titubation</code> (negative lower-limb involvement). Furthermore, <strong>2024-07-17 IMC 2h EEG (9 timestamped epochs, 11:42–13:28)</strong> proves 9 Hz alpha with bilateral fronto-temporal EMG tremor bursts and <strong>zero epileptiform spikes</strong>.", "<strong>06:00–08:59 AM Holter PVC Cluster:</strong> <code>36.29%</code> of all 857 PVCs (311/857; peaking at 164 PVCs/hr & <code>104 bpm</code> V-run @ 08:00 AM) cluster alongside <code>80 IU/day</code> insulin (Toujeo 30U + Apidra 50U), strongly implicating morning neuroglycopenia & catecholamine surges!", "<strong>Medication & Hypoglycemia Trap:</strong> Non-selective <code>Inderal 10 mg BID</code> masks insulin hypoglycemia alarms; <code>Angiopress Comp (HCTZ) + Cidamex</code> risks dangerous hypokalemia/PVCs; triple platelet inhibition (<code>Aggrex + Ginkgo + Escitalopram</code>) raises intracerebral/GI bleeding hazard.", "<strong>Structured Resolution:</strong> Perform supervised off/on <code>Sinemet MDS-UPDRS</code> test + <strong>14-day CGM</strong> + serum <code>K+/Mg2+/eGFR</code> before transitioning to Bisoprolol & high-intensity statin for the <code>5 mm</code> carotid plaque."], "tie": "Bridges Neurology, Cardiology, and Endocrinology by showing how 06–09 AM glycemia + K+ status jointly modulate arrhythmia, tremor, and dizziness."}, {"id": 4, "role": "Consultant 4 — Senior Consultant in Neurosurgery", "badge": "b-green", "verdict": "No Tumor, Aneurysm, Hydrocephalus, or High-Grade Cognard IIb–IV dAVF — Neurosurgical Intervention Not Indicated", "findings": ["<strong>Cross-Modal 2024 CT & 2026 MRI Clearance (ROI5b + ROI3):</strong> Zero extra-axial cerebellopontine mass (meningioma/schwannoma excluded), no intracranial aneurysm, Chiari malformation, subdural collection, or hydrocephalus.", "<strong>Cortical Venous Reflux Exclusion:</strong> Complete absence of engorged pial/cortical veins, medullary venous hypertension, or cerebellar edema confirms zero neurosurgical hemorrhagic emergency.", "<strong>Validation of Measured Conservative Workup:</strong> Honors Prof. Galhom's appropriate index of suspicion while endorsing non-invasive clearance prior to crossing atheromatous cervical vessels; preserve dominant Right sinus flow completely."], "tie": "Protects the compensated dominant Right venous drainage while sparing an elderly visually impaired diabetic patient avoidable surgical/invasive risk."}, {"id": 5, "role": "Consultant 5 — Neuro-Interventional Radiology (DSA Controversy Resolution)", "badge": "b-red", "verdict": "DEFER IMMEDIATE CATHETER DSA — Enforce Mandatory 3-Step Non-Invasive Gatekeeper Protocol", "findings": ["<strong>Left Carotid Bulb Embolic Hazard:</strong> <code>2026-11-07</code> Duplex reveals <code>0.13 cm</code> IMT and a <strong>5 mm atheromatous plaque at the Left Carotid Bulb</strong> directly along the catheter navigation path toward ECA/occipital arteries.", "<strong>Pending Renal & Myocardial Safety Gates:</strong> Unknown Cr/eGFR while taking Metformin (<code>Gliptus Plus</code>) risks lactic acidosis & CIN, while active <code>-2.1 mm</code> Holter ST ischemia + <code>3.78%</code> AM PVC burden raises intraprocedural cardiac risk.", "<strong>3-Step Gatekeeper Pathway:</strong> (1) Quiet mastoid auscultation + <em>light anterior IJV vs pinpoint occipital pressure</em> -> (2) Sinus/venous optimization OR <strong>4D-MRA / Temporal Bone HRCT+CTA/CTV</strong> (only after eGFR verification + 48h Metformin hold) -> (3) Conditional DSA strictly if objective shunt evidence persists."], "tie": "Resolves the central clinical disagreement rigorously using quantitative Duplex plaque, Metformin/renal, and Holter ischemia data."}, {"id": 6, "role": "Consultant 6 — ENT, Neurotology & Clinical Audiology", "badge": "b-blue", "verdict": "2026-11-03 Definitive Masked SNHL (0 dB ABG, Rt WRS 84%, Lt WRS 76%) + Extreme Type Ad (3.2 cm3) + 4-Hit Vertigo", "findings": ["<strong>Definitive Masked Pure-Tone & Speech Baseline (ROI5a):</strong> Masked AC=BC eliminates any conductive gap (<strong>0 dB ABG</strong>): Right <code>20–70 dB</code> (3f PTA <code>40.0 dB</code>, SRT 25 dB, WRS <strong>84%</strong>); Left <code>50–80 dB</code> (3f PTA <code>54.2 dB</code>, SRT 50 dB, WRS <strong>76%</strong>).", "<strong>Thermal GSI-39 Refutes Handwritten 'Rt As':</strong> Machine printout proves Right Peak <strong>1.5 cm3</strong> @ -5 daPa (Normal/upper-normal Type A, ECV 1.3) and Left Peak <strong>3.2 cm3</strong> exceeding the 3.0 cm3 plot ceiling (Extreme Type Ad, <code>2.13x</code> contralateral compliance, I 1000 Hz NT).", "<strong>Dual-Acoustic Vascular Hum Mechanism:</strong> Ultra-compliant flaccid monomeric Left TM (<code>3.2 cm3</code>) behaves as an acoustic resonator amplifying venous blood hum from the attenuated <code>0.48</code> sinus + irregular Holter post-PVC stroke surges (NOT ossicular discontinuity, given 0 dB ABG).", "<strong>Safe Rehabilitation & Blindness VNG Alert:</strong> <strong>STOP Meclizine & Ginkgo</strong>; treat ethmoiditis with Mometasone; adapt VNG (dark positional + calorics ONLY); start non-visual VRT + Bilateral <strong>Open-Fit WDRC RIC (`OSPL90 <= 95–100 dB`)</strong> honoring historical positive Metz recruitment (<code>45 dB SL</code>)."], "tie": "Reconciles handwritten chart errors with primary instrument traces and transforms ENT care safely around legal blindness."}], "ar": [{"id": 1, "role": "استشاري 1 — الأشعة التشخيصية للرأس والرقبة والأعصاب", "badge": "b-blue", "verdict": "سيادة وريدية يمينية في MRV (نسبة 0.48)، تصلب شرايين Fazekas 1–2، زيت سيليكون دائم بالعين الشمال منذ 2024، وعدم وجود ناسور عالي التدفق", "findings": ["<strong>مراجعة الرنين الوريدي <bdi dir='ltr'>MRV (Film06)</bdi>:</strong> ضيق متجانس بالجيب المستعرض والسيني والوريد الوداجي الداخلي الشمال (نسبة القطر <strong>0.48</strong> مقارنة باليمين السائد) مع <strong>انعدام تام لأي جلطة وريدية قحفية</strong>.", "<strong>مراجعة مقاطع الشرايين الـ 513 (<bdi dir='ltr'>3D-TOF MRA</bdi>):</strong> خلايا النتوء الحلمي مهوّاة وسليمة، دائرة ويليس مفتوحة بالكامل، بدون تغذية شريانية متضخمة أو ارتجاع وريدي قشري (مع الإقرار بعدم قدرة 1.5 تسلا على نفي نواسير Cognard I متناهية الصغر).", "<strong>إغفال التقرير الرسمي لزيت السيليكون ومقارنة 2024:</strong> التقرير الرسمي لم يذكر السطوع القوي <strong>لزيت السيليكون بالعين الشمال</strong> (نسبة إشارة <strong>2.59 ضعف</strong> للعين اليمنى)، وهو مثبت في مقطعية الزهور <bdi dir='ltr'>2024-07-27</bdi> مع ضمور العصبين البصريين.", "<strong>قنوات السمع والجيوب الأنفية (<bdi dir='ltr'>ROI2</bdi>):</strong> سلامة قنوات السمع الداخلية والأعصاب السابع والثامن بالجهتين (استبعاد ورم العصب السمعي) مع التهاب مخاطي ثنائي بالجيوب الغربالية."], "tie": "يربط تشريحياً بين ضيق الوريد الأيسر والتهاب الجيوب الأنفية وأعراض الأذن مع توثيق قِدم إصابة العين الشمال."}, {"id": 2, "role": "استشاري 2 — التصلب المتعدد (MS) وأمراض المادة البيضاء", "badge": "b-green", "verdict": "استبعاد التصلب المتعدد (MS) والتهاب الأوعية المناعي تماماً — التغيرات ناتجة عن تصلب الشرايين الدقيقة (CSVD) المرتبط بالضغط والسكر والقلب", "findings": ["<strong>سلبية معايير ماكدونالد 2017:</strong> البؤر النقطية والخطوط الرقيقة حول البطينات لا تملك شكل 'أصابع داوسون' العمودية ولا تصيب الجسم الثفني أو المخيخ أو جذع المخ أو الألياف القشرية.", "<strong>براءة مجالات الانتشار <bdi dir='ltr'>DWI/ADC</bdi>:</strong> غياب تام لأي جلطة دماغية حادة حالياً، بينما البؤر الموجودة تمثل جلطات لاكونار قديمة مستقرة في العقد القاعدية اليمين والفصين الجبهي الشمال والجداري اليمين.", "<strong>الارتباط الوثيق مع الهولتر والسباتي:</strong> هبوط التروية التاجية بالهولتر (<code>-2.1 مم</code>) مع الطفرة الصباحية للخفقات وزيادة سمك جدار الشريان السباتي (<code>0.13 سم</code>) يفسران إجهاد التروية الدقيقة للمخ وتكرار الدوار.", "<strong>لا حاجة لبذل النخاع:</strong> كف البصر (&lt; 1/60) سببه انفصال شبكي وزيت سيليكون وضمور عصب قديم وليس التهاب عصب بصري مناعي؛ <strong>يُمنع إجراء بذل ظهر أو فحوصات MS</strong>."], "tie": "يجنّب المريضة فحوصات مناعية مكلفة ومؤلمة ويركز الجهد الطبي على ضبط الضغط والسكر ومضادات تصلب الشرايين."}, {"id": 3, "role": "استشاري 3 — الباطنة العصبية والأوعية الدموية واضطرابات الحركة", "badge": "b-amber", "verdict": "رعشة مختلطة (رعشة أساسية + رعشة رأس + قابلية العقد القاعدية + اندفاع أدرينالين صامت مع الأنسولين الصباحي)", "findings": ["<strong>حل تعارض الشلل الرعاش والصرع:</strong> فحص أ.د. جلهوم سجّل بوضوح <code>Essential tremor + Titubation</code> (مع سلامة الطرفين السفليين) على عكس صرف <code>Sinemet</code> السابق؛ كما أن <strong>تخطيط المخ المطول 2024 (9 مقاطع، ساعتان)</strong> أثبت إيقاع ألفا 9 هيرتز وذبذبات عضلية للرعشة فقط مع خلو تام من الصرع.", "<strong>لغز الطفرة الصباحية بالهولتر (6–9 صباحاً):</strong> تركز <strong>36.29% من جميع خفقات اليوم</strong> (311 من 857، بذروة 164 خفقة/ساعة وتسارع 104 ن/د الساعة 08:00 ص) يتزامن مع جرعة أنسولين يومية كبيرة (80 وحدة: توجيو 30 + أبيدرا 50)، مما يشير بقوة لنوبات هبوط سكر صامت وتحفيز أدرينالين!", "<strong>تداخلات الأدوية المهددة للحياة:</strong> دواء الضغط <code>Angiopress Comp</code> يحمل الثيازيد المستنزف للبوتاسيوم، وإضافة <code>Cidamex</code> تضاعف خطر الخفقات البطينية؛ ودواء <code>Inderal</code> يخفي تسارع القلب ورعشة إنذار هبوط السكر؛ وجمع <code>Aggrex + Ginkgo + Ciprapra</code> يضاعف خطر النزيف.", "<strong>خطة التحقق:</strong> عمل اختبار <code>MDS-UPDRS</code> مع وبدون <code>Sinemet</code> + تركيب سنسور سكر <code>CGM</code> لمدة 14 يوماً + تحاليل الكهارل والكلى."], "tie": "يربط بين السكر والغدد والقلب لتفسير ذروة الأعراض في ساعات الصباح الأولى وتصحيح خطة الأدوية الخطرة."}, {"id": 4, "role": "استشاري 4 — جراحة المخ والأعصاب", "badge": "b-green", "verdict": "لا أورام أو تمددات شريانية أو استسقاء أو ارتجاع وريدي قشري عالي الخطورة (Cognard IIb–IV) — لا تدخل جراحياً أو قسطرة مستعجلة", "findings": ["<strong>السلامة البنيوية في 2024 و2026 (<bdi dir='ltr'>ROI5b + ROI3</bdi>):</strong> خلو زاوية المخيخ والجسر وقنوات السمع من أي أورام، وانعدام التمددات الشريانية أو الاستسقاء الدماغي أو النزيف.", "<strong>نفي الارتجاع الوريدي القشري الخطر:</strong> عدم وجود أوردة قشرية متضخمة أو احتقان وريدي بالمخيخ ينفي أي طوارئ نزفية جراحية.", "<strong>احترام التفكير التشخيصي والحفاظ على السريان السائد:</strong> تقدير حذر د. جلهوم السريري مع تأكيد أولوية الفرز الآمن غير التدخلي وحماية الوريد الأيمن السائد بالكامل."], "tie": "يؤكد أن الجيب الوريدي الأيمن يعوض تصريف المخ بكفاءة وأن المريضة ليست في خطر جراحي عاجل."}, {"id": 5, "role": "استشاري 5 — القسطرة المخية والأشعة التداخلية (حسم جدل الـ DSA)", "badge": "b-red", "verdict": "تأجيل القسطرة المخية التشخيصية (DSA) فوراً — تطبيق بروتوكول الفرز الثلاثي غير التدخلي الإجباري أولاً", "findings": ["<strong>خطورة البلاك السباتي في مسار القسطرة:</strong> أثبت الدوبلكس (2026-11-07) سماكة جدار 0.13 سم و<strong>بلاك متصلباً بطول 5 مم في عنق الشريان السباتي الشمال</strong> في الطريق المباشر للقسطرة نحو السباتي الخارجي.", "<strong>بوابات الأمان الكلوية والقلبية غير المكتملة:</strong> عدم قياس وظائف الكلى (eGFR) مع استخدام الميتفورمين يحمل خطر الحماض اللاكتيكي بالصبغة، بينما هبوط تروية <code>-2.1 مم</code> بالهولتر يرفع خطورة القسطرة.", "<strong>الفرز الثلاثي الآمن:</strong> (1) تسمّع بالسماعة خلف الأذن مع <em>مقارنة الضغط الأمامي اللطيف على الوريد الوداجي بالضغط النقطي الدقيق على الشريان القذالي</em> -> (2) علاج الجيوب الأنفية، أو طلب <strong>رنين ديناميكي 4D-MRA / مقطعية بالصبغة لعظمة الأذن</strong> بعد فحص الكلى وإيقاف الميتفورمين 48 ساعة -> (3) القسطرة فقط إن ثبت ناسور مؤكداً."], "tie": "يحسم الخلاف الاستشاري الرئيسي بأرقام موضوعية من الدوبلكس والهولتر لحماية المريضة من جلطة أو مضاعفات كلوية."}, {"id": 6, "role": "استشاري 6 — أمراض الأذن والاتزان والسمعيات الإكلينيكية", "badge": "b-blue", "verdict": "توثيق 2026-11-03: ضعف سمع قوقعي مستقر (0 dB فجوة، تمييز 84%/76%) + طبلية شمال مرنة جداً 3.2 سم³ + فشل اتزان رباعي", "findings": ["<strong>اعتماد التخطيط المقنع الحديث (<bdi dir='ltr'>ROI5a</bdi>):</strong> قياس العصب والهواء بقناع عكسي يثبت <strong>0 dB ABG</strong> بالجهتين (يمين: عتبة 40 dB وتمييز كلام <strong>84%</strong>؛ شمال: عتبة 54.2 dB وتمييز كلام <strong>76%</strong>).", "<strong>الطابعة الحرارية <bdi dir='ltr'>GSI-39</bdi> تكذب ملاحظة 'Rt As':</strong> قراءة الجهاز المطبوعة تُظهر اليمين بقمة <strong>1.5 سم³</strong> عند -5 daPa (طبيعي Type A)، بينما الشمال <strong>3.2 سم³</strong> يتعدى سقف الورقة (مرونة مفرطة Type Ad بمقدار 2.13 ضعف اليمين، المنعكس NT).", "<strong>مكبر صوت بيولوجي للنبض الوريدي والقلبي:</strong> مرونة الطبلية الشمال الملتئمة الرقيقة (3.2 سم³) تكبّر سماع تدفق الجيب الوريدي الضيق (0.48) واندفاعات ما بعد الخفقات القلبية بدون أن تكون انفصالاً عظمياً لغياب الفجوة التوصيلية تماماً.", "<strong>بروتوكول الأمان السمعي والاتزان:</strong> <strong>وقف ميكليزين وجينكو فوراً</strong>، بخاخ الموميتازون للجيوب الغربالية، فحص VNG <strong>بالظلام فقط</strong>، تأهيل اتزان لا بصري، وسماعتان <strong>Open-Fit WDRC RIC</strong> بحد أقصى <code>&lt;= 95–100 dB SPL</code> باليسرى لحساسية Metz (+45 dB SL)."], "tie": "يصحح خطأً كتابياً في ملف السمع، ويفسر الطنين فيزيائياً بدقة، ويحول رعاية الأذن لتتوافق مع كف البصر والقلب."}]}, "dilemmas": {"en": [{"title": "1. Left Pulsatile Tinnitus & Catheter DSA Controversy", "left_lbl": "Clinical Conflict: Pro-DSA vs Anti-DSA & Neck Pressure", "left": "Prof. Galhom questioned an occult low-flow occipital Cognard I dAVF (triggered by posterior neck pressure stopping the sound), whereas Neuro-Intervention cited normal MRA, MRV asymmetry, and vascular risk. Crucially, deep posterior neck pressure compresses BOTH IJV and Occipital Artery.", "right_lbl": "MDT Board Consensus & Pathophysiology", "right": "<strong>DEFER DSA.</strong> Likely venous hum from attenuated Lt TS/Sigmoid/IJV (<code>L/R 0.48</code>) amplified acoustically by the <strong>3.2 cm3 Extreme Type Ad Lt TM</strong> + nocturnal supine CVP surge &amp; Holter <code>3.78%</code> AM PVC pauses. Apply the <strong>3-Step Gatekeeper</strong> (light anterior IJV vs pinpoint occipital -> 4D-MRA / CTA after eGFR &amp; 48h Metformin hold -> DSA only if positive) to protect the <strong>5 mm Lt carotid bulb plaque</strong>."}, {"title": "2. White Matter Foci, 2024 2h EEG & Mixed Tremor Conflict", "left_lbl": "Diagnostic Conflict: MS? Parkinson's? Epilepsy?", "left": "Official MRI queried demyelinating white matter lesions; legacy notes listed Parkinson's disease (<code>Sinemet</code>); IMC ordered a 2024 CT/2h EEG for tremors; and Prof. Galhom documented <code>Essential tremor + Titubation</code> (negative lower-limb involvement).", "right_lbl": "MDT Board Consensus & Pathophysiology", "right": "<strong>MS &amp; Epilepsy EXCLUDED.</strong> 2026 MRI proves hypertensive-diabetic <strong>CSVD Fazekas 1–2</strong> + Rt BG lacune; <code>2024-07-17 2h EEG (9 epochs)</code> shows normal 9 Hz alpha + benign EMG tremor bursts only (0 spikes). Tremor is <strong>mixed</strong> (ET + titubation + BG vascular + <code>80 IU/d</code> insulin dips driving <code>36.29%</code> AM PVCs). Run supervised <strong>off/on Sinemet MDS-UPDRS</strong> + <strong>14-day CGM</strong>."}, {"title": "3. Disabling '4-Hit' Multi-Sensory Vertigo & Visual VNG Trap", "left_lbl": "Safety Trap: Routine Light-Tracked VNG & Chronic Meclizine", "left": "Routine VNG was requested alongside daily <code>Meclizine</code> x1 month despite undisclosed MOH 2021 bilateral legal blindness (<code>&lt; 1/60</code> better eye) and persistent <code>2.59x</code> Lt intraocular silicone oil.", "right_lbl": "MDT Board Consensus & Pathophysiology", "right": "<strong>'4-Hit' Vestibular Failure:</strong> Hit 1 (Lt inner-ear ischemia) + Hit 2 (<strong>&lt;1/60 legal blindness</strong> stripping ~95% visual stabilization) + Hit 3 (CSVD + diabetic neuropathy + chronic <strong>Meclizine</strong> suppression) + Hit 4 (PVCs / <code>-2.1 mm ST</code> / glycemic dips). <strong>STOP Meclizine</strong>; issue written notice for <strong>dark positional + calorics VNG ONLY</strong>; start non-visual somatosensory VRT."}, {"title": "4. Definitive 2026-11-03 Auditory & 'Rt As' Tympanometry Paradox", "left_lbl": "Instrument Paradox: Handwritten 'Rt As' Note vs GSI-39 Printout", "left": "2026-11-03 audiogram bears handwritten chart note <code>'Rt As'</code> while GSI-39 thermal trace prints <code>Rt 1.5 cm3</code> &amp; <code>Lt 3.2 cm3</code> (&gt;3.0 graph ceiling), alongside historical high-level pain sensitivity.", "right_lbl": "MDT Board Consensus & Pathophysiology", "right": "<strong>Primary GSI-39 Thermal Trace Governs:</strong> Rt peak is <strong>1.5 cm3 Normal Type A</strong> (refuting 'Rt As'; ECV 1.3), and Lt is <strong>3.2 cm3 Extreme Type Ad</strong> with <strong>0 dB ABG</strong> (monomeric healed drum amplifying venous/cardiac pulsatility, NOT ossicular disruption!). Pure cochlear SNHL (Rt WRS <code>84%</code>, Lt WRS <code>76%</code>) + historical Metz <code>+45 dB SL</code> demands <strong>Bilateral Open-Fit WDRC RIC (`OSPL90 &lt;= 95–100 dB`)</strong>."}], "ar": [{"title": "1. الطنين النابض الأيسر وجدل القسطرة المخية التشخيصية (DSA)", "left_lbl": "الخلاف السريري: مؤيد القسطرة مقابل المعارض وفخ الضغط على الرقبة", "left": "اشتبه أ.د. جلهوم بوجود ناسور شرياني وريدي قذالي خفي لتوقف الصوت عند ضغط مؤخرة الرأس؛ بينما رفض استشاري التداخل القسطرة لسلامة MRA وتكاليف الخطورة. الخدعة أن الضغط الخلفي يغلق الوريد الوداجي والشريان القذالي معاً!", "right_lbl": "حسم اللجنة والآلية الفيزيولوجية الموحدة", "right": "<strong>تأجيل القسطرة (DSA) فوراً.</strong> الصوت ناتج غالباً عن همهمة الجيب الوريدي الضيق (<bdi dir='ltr'>0.48</bdi>) مضخّمة ميكانيكياً عبر <strong>طبلية الشمال المرنة 3.2 سم³</strong> وطفرات نبض ما بعد الخفقات البطينية. يُطبّق <strong>بروتوكول الفرز الثلاثي</strong> (اختبار الضغط الأمامي اللطيف مقابل النقطي &rarr; <bdi dir='ltr'>4D-MRA</bdi> بعد eGFR وإيقاف الميتفورمين 48 ساعة &rarr; القسطرة فقط إن ثبت ناسور) لحماية <strong>بلاك الـ 5 مم بالسباتي الشمال</strong>."}, {"title": "2. بؤر المادة البيضاء، تخطيط المخ 2024، وحسم لغز الرعشة", "left_lbl": "التشابك التشخيصي: تصلب متعدد؟ شلل رعاش؟ صرع؟", "left": "أثار الرنين تساؤل بؤر المادة البيضاء، وذكرت أوراق سابقة باركنسون (سينيمت)، وطُلبت مقطعية وتخطيط 2024 للرعشة، بينما سجّل أ.د. جلهوم <bdi dir='ltr'>Essential tremor + Titubation</bdi>.", "right_lbl": "حسم اللجنة والآلية الفيزيولوجية الموحدة", "right": "<strong>استبعاد التصلب المتعدد (MS) والصرع قطعاً.</strong> الرنين يثبت <strong>تصلب الشرايين الدقيقة CSVD (Fazekas 1–2)</strong> وجلطة قديمة؛ وتخطيط الساعتين (2024 - 9 مقاطع) يثبت خلفية ألفا 9 هيرتز وذبذبة عضلية بدون صرع. الرعشة <strong>مختلطة</strong> وتتأثر بهبوط سكر 80 وحدة أنسولين صباحاً (36.29% PVCs). يلزم اختبار <bdi dir='ltr'>MDS-UPDRS</bdi> + سنسور سكر <bdi dir='ltr'>CGM 14 يوماً</bdi>."}, {"title": "3. فشل الاتزان الرباعي ('4-Hit') وفخ فحص VNG الضوئي", "left_lbl": "خطورة طلب VNG القياسي مع الت he external treating doctors diverged over Catheter DSA, Vertigo testing, Tremor etiology, and Tympanometry — and the anatomical pitfalls the MDT board uncovered.", "priorCards": [{"role": "Prior Neurosurgery Consultation", "doctor": "Prof. Dr. Ayman Elsayed Ali Galhom (2026-11-02 & 2026-11-03, No. 25334)", "badge": "b-amber", "tag": "Pro-DSA", "stance": "Suspected Occult Low-Flow Occipital dAVF -> Recommended DSA + Extensive Vascular Workup; Documented Essential Tremor", "points": ["<strong>Occipital dAVF Hypothesis:</strong> Posterior neck/suboccipital manual pressure abolished the left-sided pulsatile bruit, raising clinical suspicion for an angiographically occult Cognard Type I dural AVF missed by routine 1.5T MRI/TOF MRA.", "<strong>Investigative Workup Ordered (2026-11-02):</strong> Ordered MRI Brain, MRV, MRA, Carotid/Vertebral Color Duplex, and 24h Holter ECG.", "<strong>Movement Exam & Prescription (2026-11-03):</strong> Logged <code>Essential tremor + Titubation</code> (with negative lower-limb involvement) alongside DM/HTN; prescribed <code>Inderal 10 mg BID</code>, <code>Ciprapra 10 mg</code> 1/2 tab, <code>Cobal F</code>, and <code>Brain-Ox</code>."]}, {"role": "Prior Neuro-Interventional Opinion", "doctor": "External Interventional Radiology Assessment", "badge": "b-blue", "tag": "Anti-DSA", "stance": "Advised AGAINST Immediate Catheter Angiography (DSA)", "points": ["<strong>Imaging & Vascular Rationale:</strong> Cited unremarkable 3D-TOF MRA (no enlarged external carotid feeders or cortical venous ectasia), pure right-dominant venous asymmetry (attenuated Lt TS/Sigmoid/IJV), and significant diabetic/atherosclerotic procedural morbidity.", "<strong>Clinical Gap Left Unresolved:</strong> Could not fully reconcile the patient's distressing bedside pulse-synchronous tinnitus or her response to posterior neck pressure without a structured non-invasive gatekeeper protocol."]}, {"role": "Prior ENT / Otology Consultation", "doctor": "Dr. Mohamed Salem Abdel-Maksoud (2026-11-03 Prescription)", "badge": "b-purple", "tag": "ENT / VNG", "stance": "Suspected Vascular Cause Behind Left Ear; Prescribed Meclizine + Ginkgo & Requested VNG", "points": ["<strong>Clinical Localization:</strong> Correctly suspected a retrotympanic/vascular abnormality behind the left ear driving pulsatile tinnitus and imbalance; requested VNG and vascular imaging.", "<strong>Hazardous Prescribing & Order Gaps:</strong> Prescribed daily <code>Meclizine qPM x 1 month</code> + <code>Cetrovit Ginkgo qAM x 2 months</code> and ordered routine VNG without flagging <code>&lt; 1/60</code> legal blindness or concurrent <code>Aggrex 75 mg</code>."]}], "bridgeTitle": "Three Forensic Pitfalls Uncovered Exclusively by the MDT Board Synthesis", "bridgeCards": [{"title": "1. The Dual-Vessel Neck Compression Pitfall", "cls": "alert-amber", "txt": "Pressing deeply over the suboccipital/mastoid soft tissues compresses <strong>BOTH the superficial occipital artery feeder AND the underlying Internal Jugular Vein (IJV)</strong> simultaneously! Thus, noise cessation during posterior neck pressure cannot distinguish an occipital dAVF from benign venous turbulence in the attenuated <code>0.48</code> Lt sinus system until separated via light anterior IJV pressure vs pinpoint occipital artery occlusion."}, {"title": "2. Hidden Procedural & Metabolic Landmines Behind DSA", "cls": "alert-red", "txt": "Prior pro-DSA vs anti-DSA arguments predated integration of the <code>2026-11-07</code> Carotid Duplex (<strong>5 mm Left Carotid Bulb Plaque</strong> right on the left CCA/ECA catheter route), the <code>2026-11-05</code> 29-page Holter (<strong>-2.1 mm CH3 ST depression + 3.78% AM PVC surge</strong>), and unknown eGFR atop <strong>Metformin (Gliptus Plus)</strong>. Deferring DSA behind non-invasive staging prevents avoidable iatrogenic stroke and lactic acidosis."}, {"title": "3. The Blindness-VNG & Pharmacologic Trap", "cls": "alert-blue", "txt": "Unreported legal blindness (<code>&lt; 1/60</code>, MOH 2021) renders optical-target VNG tracking meaningless while stripping ~95% of visual postural balance. Combining prolonged daily <code>Meclizine</code> + <code>Brain-Ox</code> + triple platelet inhibition (<code>Aggrex + Ginkgo + Escitalopram</code>) + non-selective <code>Inderal</code> on <code>80 IU/d</code> insulin converts diagnostic uncertainty into acute fall, bleeding, and silent hypoglycemia hazards."}]}, "t4": {"head": "6-Consultant Multidisciplinary Board Audits (Fellowship-Grade Independent Reviews)", "sub": "Select an individual specialist to focus or view all 6 complete board reports integrating the 2026-11-03 GSI-39/PTA, 2026-11-05 MRI/Holter 29p, 2026-11-07 Duplex, and 2024 CT/2h EEG.", "allBtn": "Show All 6 Consultants", "verdictLbl": "Consultant Verdict:", "tieLbl": "Cross-System Integration:"}, "t5": {"head": "Final Ranked Multidisciplinary Consensus & Resolution of the 4 Core Clinical Dilemmas", "rankHead": "1. Ranked Multidisciplinary Diagnosis (Priority 1 to 8)", "rankedDx": [{"rank": "01", "cls": "b-blue", "cat": "Cerebrovascular", "title": "Hypertensive-Diabetic Cerebral Small Vessel Disease (CSVD, Fazekas 1–2) & Chronic Right Lentiform Lacune", "evidence": "Proven on Film07/09/10 with ZERO acute diffusion restriction on Film05 DWI/ADC. Multiple Sclerosis & cortical epilepsy are definitively EXCLUDED (2017 McDonald negative + 2024 9-epoch EEG normal)."}, {"rank": "02", "cls": "b-red", "cat": "Cardiovascular", "title": "High-Risk Carotid Atherosclerosis (IMT 0.13 cm, 5 mm Lt Bulb Plaque) + Silent Myocardial Ischemia (-2.1 mm ST)", "evidence": "Duplex (2026-11-07) + Holter CH3 (160 ST min, max -2.1 mm @ 13:11). Establishes an endothelial microangiopathy axis linking heart, brain, and inner ear while blocking reckless catheterization."}, {"rank": "03", "cls": "b-red", "cat": "Arrhythmia / Metabolic", "title": "Circadian Morning Ventricular Ectopy Surge (857 PVCs, 4 V-Runs) & 153 SVEs on 80 IU/d Insulin", "evidence": "36.29% of all 24h PVCs cluster 06:00–08:59 AM (peaking at 164 PVCs/hr = 3.78% burden & 104 bpm V-run @ 08:00 AM), tightly suspicious for occult morning hypoglycemia and/or HCTZ potassium depletion."}, {"rank": "04", "cls": "b-amber", "cat": "Venous / Neuro-Otology", "title": "Left Pulsatile Venous Hum (Attenuated Lt TS/Sigmoid/IJV, L/R 0.48) Amplified by 3.2 cm3 Type Ad Eardrum", "evidence": "Zero dural sinus thrombosis on 3D-PCA MRV. Post-PVC pulse surges traverse a narrowed venous conduit beside an ultra-flaccid healed tympanic membrane (>3.0 cm3 plot ceiling); occult low-flow dAVF kept on conditional Gatekeeper hold."}, {"rank": "05", "cls": "b-red", "cat": "Balance / Multi-Sensory", "title": "'4-Hit' Multi-Sensory Vestibular Failure & High Fall-Risk Instability", "evidence": "Concurrence of (1) Lt inner-ear microvascular injury, (2) MOH <1/60 legal blindness (silicone oil 2.59x), (3) CSVD + chronic daily Meclizine sedation, and (4) glycemic/arrhythmic drops."}, {"rank": "06", "cls": "b-blue", "cat": "Audiology", "title": "Bilateral Asymmetric Pure Cochlear Sensorineural Hearing Loss (0 dB ABG) — Resolved 'Rt As' Artifact", "evidence": "2026-11-03 Masked PTA (Rt 40.0 dB / WRS 84%; Lt 54.2 dB / WRS 76%) + historical Metz +45 dB SL recruitment. Primary GSI-39 printout proves Rt Peak 1.5 cm3 Normal Type A, overturning the handwritten 'Rt As' note."}, {"rank": "07", "cls": "b-purple", "cat": "Movement", "title": "Mixed Tremor Syndrome (Essential Tremor + Titubation + BG Lacune + Adrenergic Dips)", "evidence": "Reconciles prior PD/Sinemet prescribing with Prof. Galhom's Essential Tremor + Titubation exam and benign 2024 2h EEG (EMG tremor artifacts only), awaiting formal off/on Sinemet MDS-UPDRS verification."}, {"rank": "08", "cls": "b-green", "cat": "ENT / Ophthalmic Audit", "title": "Bilateral Ethmoidal Mucosal Sinusitis & Persistent Unreported Left Intraocular Silicone Oil", "evidence": "MRI Films 07/09/10 confirm ethmoiditis contributing to aural fullness; 2024-07-27 CT confirms left silicone oil predated Nov 2026 MRI by 27 months despite complete omission on Rology report."}], "dilHead": "2. Scientific Resolution of the 4 Core Clinical Dilemmas"}, "t6": {"head": "Prioritized Next Workup, Drug-Interaction Audit & Master Treatment Plan", "resetBtn": "Reset Checklist", "checkHead": "1. Interactive Phase 1–2 Diagnostic & Clinical Workup Checklist (Saved Locally)", "doneWord": "Completed", "auditHead": "2. Pharmacotherapy & Drug-Interaction Safety Audit (7 High-Risk Nodes)", "auditFilters": [{"tag": "ALL", "lbl": "All (7)"}, {"tag": "STOP", "lbl": "Stop / Avoid"}, {"tag": "CAUTION", "lbl": "High Caution / Switch"}, {"tag": "UPGRADE", "lbl": "Upgrade / Add"}], "auditCols": ["Medication / Combination", "Action", "Pharmacological Mechanism", "Patient-Specific Hazard", "MDT Resolution"], "rxHead": "3. Modified Prescription & Rehabilitation Strategy Matrix", "rxCols": ["Clinical Domain", "Modified Regimen / Intervention", "Timing & Monitoring", "Clinical Rationale & Safety Guardrails"], "haHead": "4. Precision Bilateral Open-Fit WDRC RIC Hearing Aid & VNG Protocol (< 1/60 Blindness)", "haPoints": ["<strong>Mandatory Bilateral Fitting:</strong> Binaural spatial auditory localization serves as her primary environmental safety navigation sense under <code>&lt; 1/60</code> legal blindness.", "<strong>Open-Fit Receiver-In-Canal (RIC) Hardware:</strong> Fit both ears with <strong>soft vented / open silicone domes</strong> (never sealed molds) so bone/venous pulsatile tinnitus is not trapped by the occlusion effect.", "<strong>WDRC &amp; Left Ear Output Cap (<code>OSPL90 &lt;= 95–100 dB SPL</code>):</strong> Essential to respect historical positive Metz cochlear loudness recruitment (<code>+45 dB SL</code>) and comfortable LDL margins.", "<strong>Written VNG Safety Mandate:</strong> Notify the vestibular lab explicitly of bilateral <code>&lt; 1/60</code> blindness — skip saccade/pursuit/OPK light tests and perform <strong>dark positional + bithermal calorics ONLY</strong>."]}}, "ar": {"pageTitle": "دراسة الحالة الطبية متعددة التخصصات — آمال مختار محمد إبراهيم (63.5 سنة)", "brandTitle": "دراسة حالة طبية متعددة التخصصات (MDT) | التقييم العصبي الوعائي والسمعي المتقدم", "brandSub": "المريضة: آمال مختار محمد إبراهيم • أنثى 63.5 سنة • الرقم القومي: 26304090300188 • 37 ملفاً طبياً موثقاً", "btnThemeDark": "الوضع الليلي", "btnThemeLight": "الوضع النهاري", "btnPrintTab": "طباعة القسم", "btnPrintAll": "تقرير كامل (PDF)", "navLabel": "مسار دراسة الحالة", "pdfLabel": "التقارير القابلة للمشاركة والفهرس", "pdfLinks": [{"href": "../05_Shareable_PDF_Reports/01_MDT_Executive_Summary_and_Action_Plan.pdf", "txt": "01. الملخص التنفيذي وخطة العمل (PDF)"}, {"href": "../05_Shareable_PDF_Reports/02_Consultant_6_Board_Audit_Reports.pdf", "txt": "02. تقارير الاستشاريين الستة التفصيلية (PDF)"}, {"href": "../05_Shareable_PDF_Reports/03_Patient_Case_Study_Full_Report.pdf", "txt": "03. المرجع الكامل لدراسة الحالة (PDF)"}, {"href": "../04_Final_MDT_Deliverables/Master_MDT_Case_Study_Report.md", "txt": "التقرير الشامل بصيغة Markdown"}, {"href": "../01_Structured_and_Renamed_Inputs/FILE_RENAMING_INDEX.md", "txt": "فهرس تسمية الـ 37 ملفاً الكامل"}], "tabs": [{"id": "tab-profile", "num": "01", "label": "01. البروفايل والتاريخ المرضي", "count": "البداية"}, {"id": "tab-workup", "num": "02", "label": "02. الفيديوهات والفحوصات والإشعاعات", "count": "3 فيديو"}, {"id": "tab-prior", "num": "03", "label": "03. آراء الأطباء السابقين والخلاف التشخيصي", "count": "الخلاف"}, {"id": "tab-board", "num": "04", "label": "04. لجنة الاستشاريين الستة", "count": "6 أطباء"}, {"id": "tab-consensus", "num": "05", "label": "05. التشخيص النهائي وحسم الخلافات", "count": "8+4"}, {"id": "tab-plan", "num": "06", "label": "06. الفحوصات القادمة والخطة العلاجية", "count": "العلاج"}], "t1": {"jumpTitle": "استوديو فيديوهات الرنين التفاعلي (MRI / MRA / MRV) جاهز في القسم 02", "jumpSub": "مشغلات فيديو مباشرة لفحص الأوردة MRV (ضيق الجيب الوريدي الشمال 0.48) وفحص الشرايين MRA (513 شريحة) والرنين المحوري T2/FLAIR موجودة مباشرة في أعلى تبويب 02.", "jumpBtn": "افتح استوديو فيديوهات الرنين الآن", "secHead": "البيانات الديموغرافية، عوامل الخطورة الوعائية، والتاريخ المرضي الكامل", "kpis": [{"cls": "accent", "lbl": "الهوية والعمر الموثق", "val": "أنثى 63.5 سنة", "sub": "تاريخ الميلاد الموثق 1963-04-09 (رقم قومي ...00188)؛ مع خطأ كتابي 1963-03-27 على فيلم الرنين"}, {"cls": "danger", "lbl": "الحالة البصرية والعينية", "val": "أقل من 1/60 (كف بصر)", "sub": "قرار وزارة الصحة 2021 (ضمور الشبكية والعصب) + وجود زيت سيليكون دائم بالعين الشمال منذ CT 2024"}, {"cls": "warn", "lbl": "الحمل الأيضي والوعائي", "val": "80 وحدة | 0.13 سم", "sub": "سكر (أنسولين + جليبتس) وضغط ودهون؛ سماكة السباتي IMT +44.4% مع بلاك 5 مم بالسباتي الشمال"}, {"cls": "danger", "lbl": "مؤشرات الهولتر والسمع", "val": "857 خفقة | 3.2 سم³", "sub": "36.29% خفقات صباحية وهبوط ST -2.1 مم؛ ضيق الجيب الوريدي 0.48؛ طبلية شمال 3.2 سم³ ويمين 1.5 سم³"}], "safetyTitle": "تحذيرات أمان طبية قاطعة (يجب قراءتها قبل طلب أي فحص أو صرف دواء)", "safetyBullets": ["<strong>بطلان اختبارات تتبع الضوء في فحص الاتزان (VNG):</strong> وجود كف بصر قانوني (&lt; 1/60 بالعين الأفضل - شهادة وزارة الصحة 2021) + زيت سيليكون بالعين الشمال يحرم المخ من 95% من الاتزان البصري ويجعل اختبارات تتبع الأضواء بالـ VNG عديمة الجدوى ومضللة.", "<strong>منع القسطرة المخية التشخيصية (DSA) الفورية:</strong> الدوبلكس أثبت وجود <strong>بلاك 5 مم عند عنق الشريان السباتي الشمال</strong> في طريق القسطرة تماماً، بينما وظائف الكلى غير مفحوصة مع أخذ الميتفورمين وهناك هبوط تروية تاجية <code>-2.1 mm</code> بالهولتر.", "<strong>حلقة خطورة الأنسولين والبوتاسيوم والأدوية الصباحية:</strong> يجب وقف <code>Meclizine</code> يومياً ومنع الجمع بين <code>Cidamex</code> و<code>HCTZ</code> لحماية البوتاسيوم ومنع زيادة الخفقات البطينية (857 PVC)، وفحص هبوط السكر الصباحي مع جرعة الأنسولين 80 وحدة ومراجعة استبدال <code>Inderal</code> الذي يخفي أعراض الهبوط."], "compHead": "1. الشكاوى السريرية الأربعة الرئيسية للمريضة", "complaints": [{"title": "طنين نابض في function getT() { return MDT_DATA.i18n[currentLang]; }

function setLang(lang) {
  currentLang = (lang === "ar") ? "ar" : "en";
  localStorage.setItem("mdt_lang_strict_v3", currentLang);
  const root = document.documentElement;
  root.setAttribute("lang", currentLang);
  root.setAttribute("dir", currentLang === "ar" ? "rtl" : "ltr");
  document.querySelectorAll(".lang-opt").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-lang") === currentLang);
  });
  renderAll();
}

function switchTab(id) {
  activeTabId = id;
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  renderSidebarNav();
}

function jumpToVideoSuite() {
  switchTab("tab-workup");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleTheme() {
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("mdt_theme_v3", next);
  renderHeaderLabels();
}

function renderHeaderLabels() {
  const t = getT();
  document.title = t.pageTitle;
  document.getElementById("brandTitle").textContent = t.brandTitle;
  document.getElementById("brandSub").textContent = t.brandSub;
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  document.getElementById("btnTheme").innerHTML = (isDark ? "☀️ " : "🌙 ") + `<span>${isDark ? t.btnThemeLight : t.btnThemeDark}</span>`;
  document.getElementById("lblPrintTab").textContent = t.btnPrintTab;
  document.getElementById("lblPrintAll").textContent = t.btnPrintAll;
  document.getElementById("lblNavHeader").textContent = t.navLabel;
  document.getElementById("lblPdfHeader").textContent = t.pdfLabel;
  document.getElementById("pdfLinksHost").innerHTML = t.pdfLinks.map(l =>
    `<a href="${l.href}" target="_blank">📄 ${l.txt}</a>`
  ).join("");
}

function renderSidebarNav() {
  const t = getT();
  document.getElementById("tabNavHost").innerHTML = t.tabs.map(tb => `
    <button type="button" class="nav-btn ${tb.id === activeTabId ? "active" : ""}" data-tab="${tb.id}" onclick="switchTab('${tb.id}')">
      <span>${tb.label}</span>
      <span class="nav-pill">${tb.count}</span>
    </button>
  `).join("");
}

function renderHolterSVG() {
  const t2 = getT().t2;
  const H = MDT_DATA.holter_hours;
  const W = 740, Ht = 278, padL = 42, padR = 42, padT = 32, padB = 46;
  const cw = W - padL - padR, ch = Ht - padT - padB;
  const barW = cw / H.length;

  let bars = "", hrPts = "", xTicks = "";
  H.forEach((d, i) => {
    const x = padL + i * barW;
    const bh = (d.pvc / 180) * ch;
    const y = padT + ch - bh;
    const isSurge = (d.h === "06:00" || d.h === "07:00" || d.h === "08:00");
    const isST = (d.h === "13:00");
    const fill = isSurge ? "#dc2626" : (isST ? "#d97706" : "#0284c7");
    bars += `<rect x="${(x + 2).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(4, barW - 4).toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${fill}" opacity="0.88"><title>${d.h}: ${d.pvc} PVCs | HR ${d.hr} | ST ${d.st}</title></rect>`;
    if (d.pvc >= 45 || isSurge) {
      bars += `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${fill}">${d.pvc}</text>`;
    }
    const hy = padT + ch - ((d.hr - 40) / 80) * ch;
    hrPts += `${(x + barW / 2).toFixed(1)},${hy.toFixed(1)} `;
    if (i % 2 === 0 || isSurge || isST) {
      xTicks += `<text x="${(x + barW / 2).toFixed(1)}" y="${Ht - 24}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.78">${d.h.slice(0, 2)}</text>`;
    }
  });

  const surgeX = padL + 21 * barW;
  const stX = padL + 4 * barW + barW / 2;

  document.getElementById("holterSvgWrap").innerHTML = `
  <svg viewBox="0 0 ${W} ${Ht}" dir="ltr" role="img" aria-label="${t2.holterChartTitle}">
    <rect x="${surgeX.toFixed(1)}" y="${padT}" width="${(3 * barW).toFixed(1)}" height="${ch}" fill="#dc2626" opacity="0.10" rx="4"/>
    <text x="${(surgeX + 1.5 * barW).toFixed(1)}" y="${padT + 12}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#dc2626">${t2.holterSurgeLbl}</text>
    <line x1="${stX.toFixed(1)}" y1="${padT + 18}" x2="${stX.toFixed(1)}" y2="${padT + ch}" stroke="#d97706" stroke-dasharray="3,3" stroke-width="1.5"/>
    <text x="${stX.toFixed(1)}" y="${padT + 14}" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">${t2.holterStLbl}</text>
    <line x1="${padL}" y1="${padT + ch}" x2="${W - padR}" y2="${padT + ch}" stroke="currentColor" opacity="0.3"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + ch}" stroke="currentColor" opacity="0.3"/>
    ${[0, 60, 120, 180].map(v => {
      const y = padT + ch - (v / 180) * ch;
      return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="currentColor" opacity="0.08"/>
              <text x="${padL - 5}" y="${y + 3}" text-anchor="end" font-size="9.5" fill="currentColor" opacity="0.72">${v}</text>`;
    }).join("")}
    ${bars}
    <polyline fill="none" stroke="#16a34a" stroke-width="2.3" points="${hrPts}"/>
    ${xTicks}
    <rect x="${padL}" y="${Ht - 14}" width="10" height="10" rx="2" fill="#0284c7"/>
    <text x="${padL + 14}" y="${Ht - 5}" font-size="10" fill="currentColor">${t2.holterLegend1}</text>
    <line x1="${W - 295}" y1="${Ht - 9}" x2="${W - 275}" y2="${Ht - 9}" stroke="#16a34a" stroke-width="2.5"/>
    <text x="${W - 270}" y="${Ht - 5}" font-size="10" fill="currentColor">${t2.holterLegend2}</text>
  </svg>
  <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;text-align:center;">${t2.holterFoot}</div>`;
}

function renderAudioSVG() {
  const t2 = getT().t2;
  const freqs = [250, 500, 1000, 2000, 4000, 8000];
  const rt = [20, 25, 45, 50, 50, 70];
  const lt = [50, 50, 55, 57.5, 70, 80];
  const W = 740, Ht = 278, padL = 48, ptaW = 395, padT = 32, padB = 46;
  const ch = Ht - padT - padB;
  const xPos = i => padL + 30 + (i / (freqs.length - 1)) * (ptaW - 50);
  const yPos = db => padT + ((db + 10) / 110) * ch;

  let rtPoly = "", ltPoly = "", markers = "", grid = "";
  [0, 20, 40, 60, 80, 100].forEach(db => {
    const y = yPos(db);
    grid += `<line x1="${padL}" y1="${y}" x2="${padL + ptaW}" y2="${y}" stroke="currentColor" opacity="0.1"/>
             <text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="9.5" fill="currentColor" opacity="0.72">${db}</text>`;
  });
  freqs.forEach((f, i) => {
    const x = xPos(i);
    grid += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT + ch}" stroke="currentColor" opacity="0.08"/>
             <text x="${x}" y="${padT + ch + 14}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.8">${f >= 1000 ? (f / 1000) + "k" : f}</text>`;
    rtPoly += `${x},${yPos(rt[i])} `;
    ltPoly += `${x},${yPos(lt[i])} `;
    markers += `<circle cx="${x}" cy="${yPos(rt[i])}" r="4.5" fill="none" stroke="#dc2626" stroke-width="2.2"/>
                <rect x="${x - 3.5}" y="${yPos(rt[i]) - 3.5}" width="7" height="7" fill="none" stroke="#dc2626" stroke-width="1.3"/>
                <text x="${x}" y="${yPos(rt[i]) - 7}" text-anchor="middle" font-size="9" fill="#dc2626" font-weight="700">${rt[i]}</text>`;
    markers += `<line x1="${x - 4}" y1="${yPos(lt[i]) - 4}" x2="${x + 4}" y2="${yPos(lt[i]) + 4}" stroke="#2563eb" stroke-width="2.2"/>
                <line x1="${x - 4}" y1="${yPos(lt[i]) + 4}" x2="${x + 4}" y2="${yPos(lt[i]) - 4}" stroke="#2563eb" stroke-width="2.2"/>
                <text x="${x}" y="${yPos(lt[i]) + 13}" text-anchor="middle" font-size="9" fill="#2563eb" font-weight="700">${lt[i]}</text>`;
  });

  const bx = 482, bw = 238;
  const maxC = 3.5;
  const tympBars = [
    { lbl: "24 Rt (As)", val: 0.3, col: "#f87171" },
    { lbl: "26 Rt (A)", val: 1.5, col: "#dc2626" },
    { lbl: "24 Lt (Ad)", val: 1.7, col: "#60a5fa" },
    { lbl: "26 Lt (Ad!)", val: 3.2, col: "#2563eb" },
  ];
  const barStep = bw / 4;
  const ceilY = padT + ch - (3.0 / maxC) * ch;

  document.getElementById("audioSvgWrap").innerHTML = `
  <svg viewBox="0 0 ${W} ${Ht}" dir="ltr" role="img" aria-label="${t2.audioChartTitle}">
    ${grid}
    <rect x="${padL}" y="${padT}" width="${ptaW}" height="${ch}" fill="none" stroke="currentColor" opacity="0.24"/>
    <polyline fill="none" stroke="#dc2626" stroke-width="2.3" points="${rtPoly}"/>
    <polyline fill="none" stroke="#2563eb" stroke-width="2.3" points="${ltPoly}"/>
    ${markers}
    <text x="${padL + 10}" y="${padT + 14}" font-size="10" font-weight="700" fill="#dc2626">● ${t2.audioRtLbl}</text>
    <text x="${padL + 10}" y="${padT + 27}" font-size="10" font-weight="700" fill="#2563eb">✕ ${t2.audioLtLbl}</text>

    <rect x="${bx}" y="${padT}" width="${bw}" height="${ch}" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.22" rx="6"/>
    <text x="${bx + bw / 2}" y="${padT - 14}" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${t2.audioTympHead}</text>
    <text x="${bx + bw / 2}" y="${padT - 3}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity="0.72">${t2.audioTympSub}</text>
    <line x1="${bx}" y1="${ceilY}" x2="${bx + bw}" y2="${ceilY}" stroke="#d97706" stroke-dasharray="4,3" stroke-width="1.3"/>
    <text x="${bx + 6}" y="${ceilY - 3}" font-size="8.8" font-weight="700" fill="#d97706">${t2.audioLimitLbl}</text>
    ${tympBars.map((tb, idx) => {
      const h = (tb.val / maxC) * ch;
      const x = bx + idx * barStep + 10;
      const y = padT + ch - h;
      return `<rect x="${x}" y="${y}" width="${barStep - 20}" height="${h}" rx="3" fill="${tb.col}"/>
              <text x="${x + (barStep - 20) / 2}" y="${y - 4}" text-anchor="middle" font-size="10" font-weight="800" fill="${tb.col}">${tb.val}</text>
              <text x="${x + (barStep - 20) / 2}" y="${padT + ch + 13}" text-anchor="middle" font-size="8.8" fill="currentColor">${tb.lbl}</text>`;
    }).join("")}
    <text x="${bx + bw / 2}" y="${Ht - 6}" text-anchor="middle" font-size="9.8" font-weight="700" fill="#16a34a">${t2.audioRefute}</text>
  </svg>`;
}

function renderFileTable() {
  const el = document.getElementById("fileSearch");
  const q = el ? el.value.trim().toLowerCase() : "";
  const isAr = (currentLang === "ar");
  const rows = MDT_DATA.files_index.filter(f => {
    const catOk = (activeFileFilter === "ALL") || (f.grp === activeFileFilter);
    const sum = isAr ? f.summary_ar : f.summary_en;
    const raw = isAr ? f.raw_ar : f.raw_en;
    const txtOk = !q || [f.cat, f.date, raw, f.newName, sum].some(s => s.toLowerCase().includes(q));
    return catOk && txtOk;
  });
  document.getElementById("fileTableBody").innerHTML = rows.map((f, idx) => `
    <tr>
      <td>${idx + 1}</td>
      <td><span class="badge b-blue">${f.cat}</span></td>
      <td><code>${f.date}</code></td>
      <td><code style="word-break:break-all;">${isAr ? f.raw_ar : f.raw_en}</code></td>
      <td><a href="${f.href}" target="_blank" style="font-weight:700;word-break:break-all;" dir="ltr">${f.newName}</a></td>
      <td style="white-space:nowrap;">${isAr ? f.size_ar : f.size_en}</td>
      <td>${isAr ? f.summary_ar : f.summary_en}</td>
    </tr>
  `).join("");
}

function setMedFilter(tag) { activeMedFilter = tag; renderTab6(); }
function toggleCheck(id, val) {
  const saved = JSON.parse(localStorage.getItem("mdt_checklist_v3") || "{}");
  saved[id] = val;
  localStorage.setItem("mdt_checklist_v3", JSON.stringify(saved));
  renderTab6();
}
function resetChecklist() {
  localStorage.removeItem("mdt_checklist_v3");
  renderTab6();
}

function printSection() {
  document.body.classList.remove("print-all");
  window.print();
}
function printFullDossier() {
  document.body.classList.add("print-all");
  window.print();
  setTimeout(() => document.body.classList.remove("print-all"), 500);
}

function openModal(idx) {
  const t2 = getT().t2;

  document.getElementById("modalTitle").textContent = r.title;
  document.getElementById("modalImg").src = r.img;

  document.getElementById("mClose").textContent = "✕ " + t2.modalBtns.close;

function setZoom(scale) { document.getElementById("modalImg").style.transform = `scale(${scale})`; }
